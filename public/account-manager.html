<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Inquiries - Wimpy Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="account-manager">
  <div class="page-shell">
    <header class="header-shell">
      <div class="header-inner">
        <div>
          <strong>Wimpy Portal</strong>
          <span>Account manager</span>
        </div>
        <div class="site-nav">
          <span id="user-badge" class="badge"></span>
          <a href="/">Home</a>
          <button id="logout-button" class="secondary">Logout</button>
        </div>
      </div>
    </header>
    <main class="main-content">
      <section class="section-title">
        <div>
          <h2>Project inquiries</h2>
          <p>Client project briefs from the main site. Update status and leave notes as you work them.</p>
        </div>
      </section>
      <div class="table-shell">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Project type</th>
              <th>Budget</th>
              <th>Message</th>
              <th>Status</th>
              <th>Notes</th>
              <th>Received</th>
            </tr>
          </thead>
          <tbody id="inquiries-body">
          </tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
